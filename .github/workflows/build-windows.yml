# Windows 桌面版自动构建
#
# 每次 push 到 main（或手动触发）时，在 GitHub 的 Windows 云主机上用
# PyInstaller 把项目打成单文件 MaterialHub.exe，构建产物挂在 Artifacts 里下载。
# 公开仓库的 Actions 免费。

name: Build Windows Desktop App

on:
  push:
    branches: [main]
    paths:
      - "**.py"
      - "static/**"
      - "requirements-desktop.txt"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-desktop.txt

      - name: PyInstaller 打包
        run: |
          pyinstaller --name MaterialHub --onefile --console `
            --add-data "static;static" `
            --hidden-import uvicorn.logging `
            --hidden-import uvicorn.loops.auto `
            --hidden-import uvicorn.protocols.http.auto `
            --hidden-import uvicorn.protocols.websockets.auto `
            --collect-all librosa `
            --collect-all numba `
            --collect-all soundfile `
            --collect-all scipy `
            --collect-all sklearn `
            desktop_main.py

      - name: 上传 exe
        uses: actions/upload-artifact@v4
        with:
          name: MaterialHub-windows
          path: dist/MaterialHub.exe
          retention-days: 30
